name: Build Music Tutor Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Project & Android Platform
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.musictutor.pro",
            "appName": "Music Tutor Pro",
            "webDir": "www"
          }
          EOF
          npx cap add android

      - name: Generate App Icons
        run: |
          # Checks for icon.png or logo.png in the repository root
          ICON_FILE=""
          if [ -f "icon.png" ]; then
            ICON_FILE="icon.png"
          elif [ -f "logo.png" ]; then
            ICON_FILE="logo.png"
          fi

          if [ -n "$ICON_FILE" ]; then
            mkdir -p assets
            cp "$ICON_FILE" assets/icon-only.png
            cp "$ICON_FILE" assets/icon-foreground.png
            cp "$ICON_FILE" assets/icon-background.png
            cp "$ICON_FILE" assets/logo.png
            npx @capacitor/assets generate --android
          elif [ -d "assets" ]; then
            npx @capacitor/assets generate --android
          else
            echo "No custom icon.png or logo.png found; using default icons."
          fi
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Music-Tutor-Pro-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
