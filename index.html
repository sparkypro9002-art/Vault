<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCU Roadmap Checklist</title>
  <style>
    :root {
      --bg-color: #0b111e;
      --card-bg: #151f30;
      --card-border: #1f2d45;
      --text-main: #e2e8f0;
      --text-muted: #7987a1;
      --accent-red: #ff3b5c;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --btn-bg: #1e293b;
      --btn-hover: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 14px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
    }

    .header-title-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #ff4b6e, #ff7a70);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Progress Card */
    .progress-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .progress-percent {
      color: var(--accent-blue);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #ec4899);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .progress-details {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Filter Tabs & Edit Trigger */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .tabs-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-container::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--accent-red);
      color: #fff;
      border-color: var(--accent-red);
    }

    .btn-mode-toggle {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-mode-toggle.active {
      background: #7c2d12;
      border-color: #ea580c;
      color: #ffedd5;
    }

    /* Edit Toolbar Drawer */
    .edit-toolbar {
      display: none;
      background: #111b2b;
      border: 1px dashed #334155;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .edit-mode-active .edit-toolbar {
      display: flex;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-action:hover {
      background: var(--btn-hover);
    }

    .btn-action.highlight {
      background: #1e3a8a;
      border-color: #3b82f6;
      color: #bfdbfe;
    }

    /* Modal / Form Panel */
    .form-panel {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .form-panel.open {
      display: block;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      padding: 8px 10px;
      background: #0d1524;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent-blue);
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    /* Phase Header */
    .phase-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #a855f7;
      margin: 18px 0 8px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .phase-dot {
      width: 6px;
      height: 6px;
      background-color: #a855f7;
      border-radius: 50%;
    }

    /* Item Card */
    .list-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: background-color 0.2s;
    }

    .item-card.completed .item-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .item-main {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-grow: 1;
      overflow: hidden;
    }

    .item-index {
      font-size: 0.82rem;
      color: var(--text-muted);
      min-width: 22px;
    }

    .item-info {
      overflow: hidden;
    }

    .item-title {
      font-size: 0.88rem;
      font-weight: 500;
      white-space: normal;
      word-break: break-word;
    }

    .item-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Action Buttons */
    .btn-toggle {
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--btn-bg);
      color: var(--text-main);
      min-width: 65px;
      text-align: center;
    }

    .btn-toggle.done {
      background: var(--accent-green);
      color: #fff;
    }

    /* Edit controls (Hidden by default) */
    .item-edit-controls {
      display: none;
      align-items: center;
      gap: 4px;
    }

    .edit-mode-active .item-edit-controls {
      display: flex;
    }

    .edit-mode-active .btn-toggle {
      display: none;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .btn-icon:hover {
      background: var(--btn-hover);
      color: #fff;
    }

    .btn-icon.delete:hover {
      background: #dc2626;
      border-color: #dc2626;
    }

    /* Quick Title Edit Button */
    .btn-edit-title {
      display: none;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .edit-mode-active .btn-edit-title {
      display: inline-block;
    }

    /* Footer Reset */
    .footer-actions {
      margin-top: 28px;
      text-align: center;
    }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background: #1e293b;
      color: var(--text-main);
    }
  </style>
</head>
<body>

<div class="container" id="app-container">
  <!-- Editable Header -->
  <header>
    <div class="header-title-container">
      <h1 id="app-title-text">MCU Roadmap to Doomsday</h1>
      <button class="btn-edit-title" onclick="editAppHeader()" title="Rename App Header">✎</button>
    </div>
    <div class="subtitle" id="app-subtitle-text">Complete Full Title Checklist</div>
  </header>

  <!-- Progress Bar Card -->
  <div class="progress-card">
    <div class="progress-header">
      <span id="progress-titles">0 / 0 Completed</span>
      <span class="progress-percent" id="progress-percent">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
    <div class="progress-details">
      <span id="progress-hours">0.0h / 0.0h watched</span>
      <span>Calculated by runtime</span>
    </div>
  </div>

  <!-- Filter tabs & Mode Toggle -->
  <div class="controls-row">
    <div class="tabs-container">
      <button class="tab-btn active" onclick="setFilter('all', this)">All</button>
      <button class="tab-btn" onclick="setFilter('phase1', this)">Phase 1: Legacy</button>
      <button class="tab-btn" onclick="setFilter('phase2', this)">Phase 2: Infinity</button>
      <button class="tab-btn" onclick="setFilter('phase3', this)">Phase 3: Multiverse</button>
    </div>

    <button class="btn-mode-toggle" id="edit-mode-btn" onclick="toggleEditMode()">
      ⚙ Edit
    </button>
  </div>

  <!-- Edit Toolbar Drawer -->
  <div class="edit-toolbar">
    <span style="font-size: 0.8rem; color: #fb923c; font-weight: 600;">Edit & Reorder Mode Active</span>
    <div class="toolbar-actions">
      <button class="btn-action highlight" onclick="openAddForm()">+ Add New Title</button>
      <button class="btn-action" onclick="editAppHeader()">✎ Edit Header</button>
    </div>
  </div>

  <!-- Add/Edit Project Form Panel -->
  <div class="form-panel" id="form-panel">
    <h3 id="form-title" style="font-size: 0.95rem; margin-bottom: 12px;">Add Project</h3>
    <input type="hidden" id="edit-id">
    
    <div class="form-group">
      <label>Title Name & Year</label>
      <input type="text" id="input-title" class="form-control" placeholder="e.g. Blade (2026)">
    </div>

    <div class="form-row">
      <div class="form-group" style="flex: 1;">
        <label>Duration (Minutes)</label>
        <input type="number" id="input-duration" class="form-control" placeholder="e.g. 135">
      </div>
      <div class="form-group" style="flex: 1;">
        <label>Phase Group</label>
        <select id="input-phase" class="form-control">
          <option value="phase1">Phase 1: Legacy</option>
          <option value="phase2">Phase 2: Infinity</option>
          <option value="phase3">Phase 3: Multiverse</option>
        </select>
      </div>
    </div>

    <div class="form-buttons">
      <button class="btn-action" onclick="closeForm()">Cancel</button>
      <button class="btn-action highlight" onclick="saveProjectForm()">Save</button>
    </div>
  </div>

  <!-- Item List -->
  <div id="list-root" class="list-container"></div>

  <div class="footer-actions">
    <button class="btn-reset" onclick="resetToFactory()">⟲ Reset to Default State</button>
  </div>
</div>

<script>
  const DEFAULT_APP_CONFIG = {
    title: "MCU Roadmap to Doomsday",
    subtitle: "Complete Full Title Checklist"
  };

  const DEFAULT_PROJECTS = [
    // Phase 1: Legacy Multiverse Foundations
    { id: "p1", phase: 'phase1', title: "X-Men (2000)", duration: 104, done: true },

    { id: "p5", phase: 'phase1', title: "Fantastic Four (2005)", duration: 106, done: true },

    { id: "p12", phase: 'phase1', title: "X-Men: Days of Future Past (2014)", duration: 132, done: true },
    { id: "p13", phase: 'phase1', title: "Deadpool (2016)", duration: 108, done: true },
    { id: "p14", phase: 'phase1', title: "Logan (2017)", duration: 137, done: true },
    { id: "p15", phase: 'phase1', title: "Deadpool 2 (2018)", duration: 119, done: true },

    // Phase 2: The Infinity Saga Core
    { id: "p16", phase: 'phase2', title: "Iron Man (2008)", duration: 126, done: true },
    { id: "p17", phase: 'phase2', title: "Iron Man 2 (2010)", duration: 124, done: true },
    { id: "p18", phase: 'phase2', title: "Thor (2011)", duration: 115, done: true },
    { id: "p19", phase: 'phase2', title: "Captain America: The First Avenger (2011)", duration: 124, done: true },
    { id: "p20", phase: 'phase2', title: "Marvel's The Avengers (2012)", duration: 143, done: true },
    { id: "p21", phase: 'phase2', title: "Captain America: The Winter Soldier (2014)", duration: 136, done: true },
    { id: "p22", phase: 'phase2', title: "Guardians of the Galaxy (2014)", duration: 121, done: true },
    { id: "p23", phase: 'phase2', title: "Avengers: Age of Ultron (2015)", duration: 141, done: true },
    { id: "p24", phase: 'phase2', title: "Ant-Man (2015)", duration: 117, done: true },
    { id: "p25", phase: 'phase2', title: "Captain America: Civil War (2016)", duration: 147, done: true },
    { id: "p26", phase: 'phase2', title: "Doctor Strange (2016)", duration: 115, done: true },
    { id: "p27", phase: 'phase2', title: "Guardians of the Galaxy Vol. 2 (2017)", duration: 136, done: true },
    { id: "p28", phase: 'phase2', title: "Spider-Man: Homecoming (2017)", duration: 133, done: true },
    { id: "p29", phase: 'phase2', title: "Thor: Ragnarok (2017)", duration: 130, done: true },
    { id: "p30", phase: 'phase2', title: "Black Panther (2018)", duration: 134, done: true },
    { id: "p31", phase: 'phase2', title: "Avengers: Infinity War (2018)", duration: 149, done: true },
    { id: "p32", phase: 'phase2', title: "Ant-Man and the Wasp (2018)", duration: 118, done: true },
    { id: "p33", phase: 'phase2', title: "Captain Marvel (2019)", duration: 124, done: true },
    { id: "p34", phase: 'phase2', title: "Avengers: Endgame (2019)", duration: 181, done: true },

    // Phase 3: The Multiverse Saga (Road to Doomsday)
    { id: "p35", phase: 'phase3', title: "Loki (Season 1) (2021)", duration: 285, done: true },
    { id: "p36", phase: 'phase3', title: "WandaVision (Season 1) (2021)", duration: 350, done: false },
    { id: "p37", phase: 'phase3', title: "The Falcon and the Winter Soldier (Season 1) (2021)", duration: 305, done: false },
    { id: "p38", phase: 'phase3', title: "Shang-Chi and the Legend of the Ten Rings (2021)", duration: 132, done: false },
    { id: "p39", phase: 'phase3', title: "Spider-Man: Far From Home (2019)", duration: 129, done: false },
    { id: "p40", phase: 'phase3', title: "Spider-Man: No Way Home (2021)", duration: 148, done: false },
    { id: "p41", phase: 'phase3', title: "Doctor Strange in the Multiverse of Madness (2022)", duration: 126, done: false },
    { id: "p42", phase: 'phase3', title: "Black Panther: Wakanda Forever (2022)", duration: 161, done: false },
    { id: "p43", phase: 'phase3', title: "Ant-Man and the Wasp: Quantumania (2023)", duration: 125, done: false },
    { id: "p44", phase: 'phase3', title: "Loki (Season 2) (2023)", duration: 290, done: false },
    { id: "p45", phase: 'phase3', title: "The Marvels (2023)", duration: 105, done: false },
    { id: "p46", phase: 'phase3', title: "Deadpool & Wolverine (2024)", duration: 128, done: false },
    { id: "p47", phase: 'phase3', title: "Agatha All Along (Season 1) (2024)", duration: 340, done: false },
    { id: "p48", phase: 'phase3', title: "Captain America: Brave New World (2025)", duration: 125, done: false },
    { id: "p49", phase: 'phase3', title: "Thunderbolts* (2025)", duration: 130, done: false },
    { id: "p50", phase: 'phase3', title: "The Fantastic Four: First Steps (2025)", duration: 130, done: false },
    { id: "p51", phase: 'phase3', title: "Spider-Man: Brand New Day (2026)", duration: 135, done: false },
    { id: "p52", phase: 'phase3', title: "Avengers: Doomsday (2026)", duration: 160, done: false }
  ];

  const phaseHeaders = {
    phase1: "PHASE 1: LEGACY MULTIVERSE FOUNDATIONS",
    phase2: "PHASE 2: THE INFINITY SAGA CORE",
    phase3: "PHASE 3: THE MULTIVERSE SAGA (ROAD TO DOOMSDAY)"
  };

  let appConfig = JSON.parse(localStorage.getItem('mcu_app_config')) || DEFAULT_APP_CONFIG;
  let projects = JSON.parse(localStorage.getItem('mcu_clean_list')) || DEFAULT_PROJECTS;
  let currentFilter = 'all';
  let isEditMode = false;

  function persist() {
    localStorage.setItem('mcu_clean_list', JSON.stringify(projects));
    localStorage.setItem('mcu_app_config', JSON.stringify(appConfig));
  }

  function toggleStatus(id) {
    const item = projects.find(p => p.id === id);
    if (item) {
      item.done = !item.done;
      persist();
      render();
    }
  }

  function toggleEditMode() {
    isEditMode = !isEditMode;
    const container = document.getElementById('app-container');
    const btn = document.getElementById('edit-mode-btn');
    
    if (isEditMode) {
      container.classList.add('edit-mode-active');
      btn.classList.add('active');
      btn.textContent = '✕ Done Editing';
    } else {
      container.classList.remove('edit-mode-active');
      btn.classList.remove('active');
      btn.textContent = '⚙ Edit';
      closeForm();
    }
    render();
  }

  function editAppHeader() {
    const newTitle = prompt("Enter new app title:", appConfig.title);
    if (newTitle !== null && newTitle.trim() !== '') {
      appConfig.title = newTitle.trim();
    }
    const newSubtitle = prompt("Enter new subtitle:", appConfig.subtitle);
    if (newSubtitle !== null && newSubtitle.trim() !== '') {
      appConfig.subtitle = newSubtitle.trim();
    }
    persist();
    renderHeader();
  }

  function renderHeader() {
    document.getElementById('app-title-text').textContent = appConfig.title;
    document.getElementById('app-subtitle-text').textContent = appConfig.subtitle;
  }

  function moveItem(index, direction) {
    const targetIndex = index + direction;
    if (targetIndex < 0 || targetIndex >= projects.length) return;
    const [moved] = projects.splice(index, 1);
    projects.splice(targetIndex, 0, moved);
    persist();
    render();
  }

  function deleteItem(id) {
    if (confirm("Delete this entry?")) {
      projects = projects.filter(p => p.id !== id);
      persist();
      render();
    }
  }

  function openAddForm() {
    document.getElementById('form-panel').classList.add('open');
    document.getElementById('form-title').textContent = "Add Project";
    document.getElementById('edit-id').value = '';
    document.getElementById('input-title').value = '';
    document.getElementById('input-duration').value = '';
    document.getElementById('input-phase').value = 'phase3';
    window.scrollTo({ top: 180, behavior: 'smooth' });
  }

  function openEditForm(id) {
    const item = projects.find(p => p.id === id);
    if (!item) return;
    document.getElementById('form-panel').classList.add('open');
    document.getElementById('form-title').textContent = "Edit Project";
    document.getElementById('edit-id').value = item.id;
    document.getElementById('input-title').value = item.title;
    document.getElementById('input-duration').value = item.duration;
    document.getElementById('input-phase').value = item.phase;
    window.scrollTo({ top: 180, behavior: 'smooth' });
  }

  function closeForm() {
    document.getElementById('form-panel').classList.remove('open');
  }

  function saveProjectForm() {
    const editId = document.getElementById('edit-id').value;
    const title = document.getElementById('input-title').value.trim();
    const duration = parseInt(document.getElementById('input-duration').value, 10);
    const phase = document.getElementById('input-phase').value;

    if (!title || isNaN(duration) || duration <= 0) {
      alert("Please enter a valid title and positive duration (minutes).");
      return;
    }

    if (editId) {
      const item = projects.find(p => p.id === editId);
      if (item) {
        item.title = title;
        item.duration = duration;
        item.phase = phase;
      }
    } else {
      projects.push({
        id: "p_" + Date.now(),
        phase,
        title,
        duration,
        done: false
      });
    }

    persist();
    closeForm();
    render();
  }

  function resetToFactory() {
    if (confirm("Reset everything back to default watchlist and watch progress?")) {
      projects = JSON.parse(JSON.stringify(DEFAULT_PROJECTS));
      appConfig = JSON.parse(JSON.stringify(DEFAULT_APP_CONFIG));
      persist();
      renderHeader();
      render();
    }
  }

  function setFilter(filter, el) {
    currentFilter = filter;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');
    render();
  }

  function formatHours(minutes) {
    return (minutes / 60).toFixed(1) + 'h';
  }

  function render() {
    const totalMinutes = projects.reduce((acc, curr) => acc + curr.duration, 0);
    const watchedMinutes = projects.reduce((acc, curr) => acc + (curr.done ? curr.duration : 0), 0);
    const watchedCount = projects.filter(p => p.done).length;
    const durationPercent = totalMinutes > 0 ? Math.round((watchedMinutes / totalMinutes) * 100) : 0;

    document.getElementById('progress-titles').textContent = `${watchedCount} / ${projects.length} Completed`;
    document.getElementById('progress-percent').textContent = `${durationPercent}%`;
    document.getElementById('progress-bar').style.width = `${durationPercent}%`;
    document.getElementById('progress-hours').textContent = `${formatHours(watchedMinutes)} / ${formatHours(totalMinutes)} watched`;

    const root = document.getElementById('list-root');
    root.innerHTML = '';

    let lastPhase = '';

    projects.forEach((item, index) => {
      if (currentFilter !== 'all' && item.phase !== currentFilter) return;

      if (currentFilter === 'all' && item.phase !== lastPhase) {
        lastPhase = item.phase;
        const phaseItems = projects.filter(p => p.phase === lastPhase);
        const phaseDone = phaseItems.filter(p => p.done).length;

        const header = document.createElement('div');
        header.className = 'phase-label';
        header.innerHTML = `<span class="phase-dot"></span> ${phaseHeaders[lastPhase] || lastPhase} (${phaseDone}/${phaseItems.length})`;
        root.appendChild(header);
      }

      const card = document.createElement('div');
      card.className = `item-card ${item.done ? 'completed' : ''}`;

      card.innerHTML = `
        <div class="item-main">
          <span class="item-index">${index + 1}.</span>
          <div class="item-info">
            <div class="item-title">${item.title}</div>
            <div class="item-meta">${formatHours(item.duration)} (${item.duration} min)</div>
          </div>
        </div>
        
        <button class="btn-toggle ${item.done ? 'done' : ''}" onclick="toggleStatus('${item.id}')">
          ${item.done ? '✓ Done' : 'Mark'}
        </button>

        <div class="item-edit-controls">
          <button class="btn-icon" onclick="moveItem(${index}, -1)" title="Move Up">▲</button>
          <button class="btn-icon" onclick="moveItem(${index}, 1)" title="Move Down">▼</button>
          <button class="btn-icon" onclick="openEditForm('${item.id}')" title="Edit details">✎</button>
          <button class="btn-icon delete" onclick="deleteItem('${item.id}')" title="Delete">✕</button>
        </div>
      `;

      root.appendChild(card);
    });
  }

  renderHeader();
  render();
</script>

</body>
</html>
